<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFT Admin — Панель выпуска картин</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #0a0118; color: #fff; font-family: system-ui, sans-serif; }
    .glass {
      background: rgba(168,85,247,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(168,85,247,0.2);
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-danger {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      transition: all 0.2s;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.3); }
    input, textarea {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(168,85,247,0.2);
      border-radius: 0.75rem;
      color: white;
      padding: 0.75rem 1rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: rgba(168,85,247,0.5); }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
    label { font-size: 0.75rem; font-weight: 600; color: rgba(168,85,247,0.8); letter-spacing: 0.05em; text-transform: uppercase; display: block; margin-bottom: 0.375rem; }
    .painting-card {
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid rgba(168,85,247,0.15);
      background: rgba(168,85,247,0.05);
      transition: transform 0.2s;
    }
    .painting-card:hover { transform: translateY(-2px); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
    }
    .badge-active   { background: rgba(16,185,129,0.2); color: #34d399; }
    .badge-inactive { background: rgba(239,68,68,0.2);  color: #f87171; }
    .notify {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 14px;
      z-index: 9999; opacity: 0; transition: opacity 0.3s;
      white-space: nowrap;
    }
    .notify.show { opacity: 1; }
    .notify.success { background: rgba(16,185,129,0.9); }
    .notify.error   { background: rgba(239,68,68,0.9); }
    .preview-img { width: 100%; height: 180px; object-fit: cover; border-radius: 0.75rem; margin-top: 8px; display: none; background: rgba(0,0,0,0.3); }
  </style>
</head>
<body class="min-h-screen p-4">

  <!-- Фон -->
  <div class="fixed inset-0 pointer-events-none" style="z-index:0;">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(circle,rgba(168,85,247,0.15) 0%,transparent 70%);filter:blur(60px);"></div>
    <div style="position:absolute;bottom:0;right:0;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.1) 0%,transparent 70%);filter:blur(80px);"></div>
  </div>

  <div class="relative z-10 max-w-lg mx-auto">

    <!-- Заголовок -->
    <div class="text-center mb-6 pt-4">
      <div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center mb-3"
           style="background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 0 30px rgba(168,85,247,0.5);">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-white">NFT Панель</h1>
      <p style="color:rgba(168,85,247,0.6);font-size:13px;margin-top:4px;">Управление картинами галереи</p>
    </div>

    <!-- Форма создания -->
    <div class="glass rounded-2xl p-5 mb-5">
      <h2 class="text-white font-bold text-base mb-4 flex items-center gap-2">
        <span style="color:#a855f7;">✦</span> Выпустить новую картину
      </h2>

      <div class="space-y-4">
        <div>
          <label>Название картины *</label>
          <input id="f-title" type="text" placeholder="Например: «Звёздный доnut #1»">
        </div>
        <div>
          <label>Описание</label>
          <textarea id="f-desc" rows="2" placeholder="Краткое описание работы..."></textarea>
        </div>
        <div>
          <label>URL изображения *</label>
          <input id="f-image" type="url" placeholder="https://..." oninput="previewImage()">
          <img id="f-preview" class="preview-img" alt="Preview" onerror="this.style.display='none'">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label>Цена (NFT ⭐) *</label>
            <input id="f-price" type="number" placeholder="100" min="1">
          </div>
          <div>
            <label>Лимит выпуска</label>
            <input id="f-supply" type="number" placeholder="0 = ∞" min="0">
          </div>
        </div>
      </div>

      <button onclick="createPainting()"
              class="btn-primary w-full mt-5 py-3.5 rounded-xl font-bold text-white text-base">
        🎨 Выпустить картину
      </button>
    </div>

    <!-- Список картин -->
    <div class="glass rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-white font-bold text-base flex items-center gap-2">
          <span style="color:#a855f7;">◈</span> Все картины
        </h2>
        <button onclick="loadPaintings()" class="text-xs px-3 py-1.5 rounded-lg"
                style="background:rgba(168,85,247,0.15);color:#a855f7;border:1px solid rgba(168,85,247,0.2);">
          ↻ Обновить
        </button>
      </div>

      <div id="paintings-list" class="space-y-3">
        <div class="text-center py-6" style="color:rgba(168,85,247,0.4);font-size:13px;">
          Загрузка...
        </div>
      </div>
    </div>

  </div>

  <!-- Уведомление -->
  <div id="notify" class="notify"></div>

  <script>
    const tg      = window.Telegram?.WebApp;
    const tgData  = tg?.initData || '';

    function getHeaders() {
      return { 'Content-Type': 'application/json', 'x-tg-data': tgData };
    }

    function showMsg(text, type = 'success') {
      const el = document.getElementById('notify');
      el.textContent = text;
      el.className   = `notify ${type} show`;
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function previewImage() {
      const url = document.getElementById('f-image').value.trim();
      const img = document.getElementById('f-preview');
      if (url.startsWith('http')) {
        img.src           = url;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }

    async function createPainting() {
      const title   = document.getElementById('f-title').value.trim();
      const desc    = document.getElementById('f-desc').value.trim();
      const imageUrl = document.getElementById('f-image').value.trim();
      const price   = parseInt(document.getElementById('f-price').value) || 0;
      const supply  = parseInt(document.getElementById('f-supply').value) || 0;

      if (!title)    return showMsg('Введите название', 'error');
      if (!imageUrl) return showMsg('Введите URL изображения', 'error');
      if (price <= 0) return showMsg('Цена должна быть > 0', 'error');

      try {
        const res  = await fetch('/api/nft/admin/paintings', {
          method:  'POST',
          headers: getHeaders(),
          body:    JSON.stringify({ title, description: desc, image_url: imageUrl, price, total_supply: supply }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.detail || 'Ошибка', 'error'); return; }

        showMsg('✓ Картина выпущена!', 'success');
        // Очищаем форму
        ['f-title','f-desc','f-image','f-price','f-supply'].forEach(id => {
          document.getElementById(id).value = '';
        });
        document.getElementById('f-preview').style.display = 'none';
        loadPaintings();
      } catch(e) {
        showMsg('Ошибка соединения', 'error');
      }
    }

    async function togglePainting(id, currentState) {
      try {
        await fetch(`/api/nft/admin/paintings/${id}`, {
          method:  'PATCH',
          headers: getHeaders(),
          body:    JSON.stringify({ is_active: !currentState }),
        });
        showMsg(currentState ? 'Снято с продажи' : 'Опубликовано', 'success');
        loadPaintings();
      } catch(e) { showMsg('Ошибка', 'error'); }
    }

    async function deletePainting(id, title) {
      if (!confirm(`Удалить картину «${title}»?\nВсе данные о владельцах будут сохранены.`)) return;
      try {
        await fetch(`/api/nft/admin/paintings/${id}`, {
          method: 'DELETE', headers: getHeaders(),
        });
        showMsg('Картина удалена', 'success');
        loadPaintings();
      } catch(e) { showMsg('Ошибка', 'error'); }
    }

    async function loadPaintings() {
      const container = document.getElementById('paintings-list');
      container.innerHTML = `<div class="text-center py-6" style="color:rgba(168,85,247,0.4);font-size:13px;">Загрузка...</div>`;
      try {
        const res  = await fetch('/api/nft/admin/paintings', { headers: getHeaders() });
        const data = await res.json();
        if (!res.ok) {
          container.innerHTML = `<div class="text-center py-6" style="color:#f87171;font-size:13px;">${data.detail || 'Нет доступа'}</div>`;
          return;
        }
        const paintings = data.paintings || [];
        if (paintings.length === 0) {
          container.innerHTML = `<div class="text-center py-8" style="color:rgba(168,85,247,0.35);font-size:13px;">Нет картин. Выпустите первую!</div>`;
          return;
        }
        container.innerHTML = paintings.map(p => `
          <div class="painting-card">
            <div class="flex gap-3 p-3">
              <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title)}"
                   class="w-20 h-20 object-cover rounded-xl flex-shrink-0"
                   onerror="this.src='https://via.placeholder.com/80?text=NFT'">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <p class="text-white font-bold text-sm truncate">${escapeHtml(p.title)}</p>
                  <span class="badge ${p.is_active ? 'badge-active' : 'badge-inactive'} flex-shrink-0">
                    ${p.is_active ? 'Активна' : 'Скрыта'}
                  </span>
                </div>
                ${p.description ? `<p class="text-xs mt-0.5 line-clamp-1" style="color:rgba(168,85,247,0.5);">${escapeHtml(p.description)}</p>` : ''}
                <div class="flex items-center gap-3 mt-1.5 text-xs" style="color:rgba(255,255,255,0.5);">
                  <span>⭐ ${p.price}</span>
                  <span>${p.total_supply > 0 ? `${p.sold_count}/${p.total_supply}` : `∞ (${p.sold_count} продано)`}</span>
                </div>
                <div class="flex gap-2 mt-2">
                  <button onclick="togglePainting(${p.id}, ${p.is_active})"
                          class="flex-1 py-1.5 rounded-lg text-xs font-bold"
                          style="background:rgba(168,85,247,0.15);color:#a855f7;border:1px solid rgba(168,85,247,0.2);">
                    ${p.is_active ? '↓ Скрыть' : '↑ Опубликовать'}
                  </button>
                  <button onclick="deletePainting(${p.id}, '${escapeHtml(p.title)}')"
                          class="btn-danger px-3 py-1.5 rounded-lg text-xs font-bold">
                    🗑
                  </button>
                </div>
              </div>
            </div>
          </div>`).join('');
      } catch(e) {
        container.innerHTML = `<div class="text-center py-6" style="color:#f87171;font-size:13px;">Ошибка загрузки</div>`;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Инициализация
    if (tg) { tg.expand(); tg.setBackgroundColor('#0a0118'); }
    loadPaintings();
  </script>
</body>
</html>

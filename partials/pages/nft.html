<!-- ═══════════════════════════════════════════════════════════
     NFT ГАЛЕРЕЯ — Современный дизайн (v2)
     Активируется через openNFTSection() / closeNFTSection()
═══════════════════════════════════════════════════════════ -->

<div id="nft-section" class="fixed inset-0 z-[60] hidden overflow-hidden"
     style="background: radial-gradient(ellipse at 20% 0%, #1c0d00 0%, #0d0601 50%, #080400 100%);">

  <!-- ══ ДЕКОРАТИВНЫЙ ФОН ══ -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[32rem] h-72 opacity-20"
         style="background: radial-gradient(ellipse at 50% 0%, #fbbf24 0%, transparent 70%); filter: blur(60px);"></div>
    <div class="absolute top-1/3 -left-24 w-72 h-72 opacity-[0.07]"
         style="background: radial-gradient(circle, #f59e0b 0%, transparent 70%); filter: blur(80px);"></div>
    <div class="absolute bottom-1/3 -right-24 w-64 h-64 opacity-[0.07]"
         style="background: radial-gradient(circle, #d97706 0%, transparent 70%); filter: blur(80px);"></div>
    <!-- Тонкая сетка -->
    <div class="absolute inset-0 opacity-[0.018]"
         style="background-image: linear-gradient(rgba(251,191,36,0.8) 1px, transparent 1px), linear-gradient(90deg, rgba(251,191,36,0.8) 1px, transparent 1px); background-size: 52px 52px;"></div>
    <!-- Верхняя золотая линия -->
    <div class="absolute top-0 left-0 right-0 h-[1px] opacity-30"
         style="background: linear-gradient(90deg, transparent, #fbbf24 30%, #fde68a 50%, #fbbf24 70%, transparent);"></div>
  </div>

  <!-- ══ КОНТЕНТ (занимает весь экран, скроллится) ══ -->
  <div class="absolute inset-0 overflow-y-auto z-10" id="nft-content-area"
       style="overscroll-behavior-y: none; -webkit-overflow-scrolling: touch;">

    <!-- ══ ПЛАВАЮЩИЙ ХЭДЕР — sticky, как в основном проекте ══ -->
    <header class="sticky top-0 z-20 px-4 flex justify-between items-center bg-transparent transition-all duration-300"
            style="padding-top: calc(3rem + var(--tg-safe-area-inset-top, 0px)); padding-bottom: 1rem;">

      <!-- Остров: Название NFT галереи -->
      <div class="nft-island-title flex items-center gap-2 px-3 py-2 rounded-2xl">
        <div class="w-7 h-7 rounded-xl flex items-center justify-center flex-shrink-0 nft-icon-badge">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#0d0601;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <div class="text-xs font-black tracking-[0.12em] uppercase nft-island-name">NFT Галерея</div>
          <div class="text-[8px] uppercase tracking-[0.18em] nft-island-sub">Цифровое искусство</div>
        </div>
      </div>

      <!-- Остров: Баланс звёзд -->
      <div class="nft-balance-island flex items-center rounded-full">
        <div class="px-3 py-2 flex items-center gap-1.5">
          <img src="/gifts/stars.png" class="w-4 h-4 object-contain drop-shadow-md" onerror="this.style.display='none'">
          <span id="nft-stars-amount" class="text-sm font-bold nft-balance-amount">0</span>
        </div>
        <button onclick="openNFTTopup()"
                class="nft-topup-btn rounded-r-full pl-2 pr-3 py-2 border-l active:scale-95 transition-all flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── СТРАНИЦА: МАГАЗИН ────────────────────────────────────────────── -->
    <div id="nft-page-shop" class="px-4 pb-32 pt-2">

      <!-- Заголовок-остров -->
      <div class="flex flex-col items-center mb-5">
        <div class="nft-section-island flex items-center gap-2 px-4 py-2 rounded-2xl mb-1.5">
          <span class="nft-island-ornament text-xs">✦</span>
          <h2 class="text-sm font-black tracking-[0.12em] uppercase nft-island-heading">Магазин картин</h2>
          <span class="nft-island-ornament text-xs">✦</span>
        </div>
        <p class="text-[9px] tracking-[0.22em] uppercase nft-section-hint">Лимитированные NFT-работы</p>
      </div>

      <!-- Список картин -->
      <div id="nft-shop-list" class="space-y-3">
        <div class="text-center py-14">
          <div class="nft-empty-frame w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center">
            <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#fbbf24;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <p class="text-sm nft-muted-text">Загрузка картин...</p>
        </div>
      </div>
    </div>

    <!-- ── СТРАНИЦА: МОЯ ГАЛЕРЕЯ ──────────────────────────────────────── -->
    <div id="nft-page-gallery" class="px-4 pb-32 pt-2 hidden">

      <div id="nft-gallery-header" class="mb-5 flex items-center gap-2">
        <button id="nft-gallery-back-btn" onclick="nftGalleryBackToList()"
                class="hidden w-8 h-8 rounded-xl flex items-center justify-center active:scale-95 transition-all nft-back-btn">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <!-- Заголовок-остров -->
        <div class="flex-1 flex flex-col items-center">
          <div class="nft-section-island flex items-center gap-2 px-4 py-2 rounded-2xl mb-1.5">
            <h2 id="nft-gallery-title" class="text-sm font-black tracking-[0.1em] uppercase nft-island-heading">Моя Галерея</h2>
          </div>
          <p id="nft-gallery-subtitle" class="text-[9px] tracking-[0.22em] uppercase nft-section-hint">Ваша коллекция NFT</p>
        </div>
      </div>

      <div id="nft-collectors-list" class="space-y-2 mb-4"></div>
      <div id="nft-gallery-grid" class="grid grid-cols-2 gap-3"></div>

      <!-- Пустая галерея -->
      <div id="nft-gallery-empty" class="hidden text-center py-14">
        <div class="nft-empty-frame w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center">
          <svg class="w-10 h-10 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <p class="nft-muted-text text-sm font-medium mb-1">Галерея пуста</p>
        <p class="nft-muted-text text-xs opacity-60 mt-1">Купите первую картину в Магазине</p>
        <button onclick="nftSwitchTab('shop')"
                class="mt-5 px-6 py-2.5 rounded-xl text-sm font-bold active:scale-95 transition-all nft-cta-btn">
          Перейти в магазин
        </button>
      </div>
    </div>

    <!-- ── СТРАНИЦА: ГАЛЕРЕИ ──────────────────────────────────────────── -->
    <div id="nft-page-galleries" class="px-4 pb-32 pt-2 hidden">

      <div class="flex flex-col items-center mb-5">
        <div class="nft-section-island flex items-center gap-2 px-4 py-2 rounded-2xl mb-1.5">
          <span class="nft-island-ornament text-xs">🌐</span>
          <h2 class="text-sm font-black tracking-[0.12em] uppercase nft-island-heading">Галереи</h2>
        </div>
        <p class="text-[9px] tracking-[0.22em] uppercase nft-section-hint">Коллекции других пользователей</p>
      </div>

      <div id="nft-galleries-back-row" class="hidden mb-3">
        <button onclick="nftGalleriesBackToList()"
                class="flex items-center gap-2 px-3 py-2 rounded-xl active:scale-95 transition-all nft-back-btn">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-xs font-semibold" style="color:#fbbf24;">Все коллекционеры</span>
        </button>
      </div>

      <div id="nft-galleries-content"></div>
    </div>

    <!-- ── СТРАНИЦА: ИСТОРИЯ ──────────────────────────────────────────── -->
    <div id="nft-page-history" class="px-4 pb-32 pt-2 hidden">

      <div class="flex flex-col items-center mb-5">
        <div class="nft-section-island flex items-center gap-2 px-4 py-2 rounded-2xl mb-1.5">
          <span class="nft-island-ornament text-xs">📜</span>
          <h2 class="text-sm font-black tracking-[0.12em] uppercase nft-island-heading">История</h2>
        </div>
        <p class="text-[9px] tracking-[0.22em] uppercase nft-section-hint">Операции с NFT-галереей</p>
      </div>

      <div id="nft-history-list" class="space-y-2"></div>
    </div>

  </div>

  <!-- ══ NFT НАВИГАЦИЯ ══ -->
  <div class="fixed left-0 w-full flex justify-center z-[70] pointer-events-none px-4"
       id="nft-nav-wrapper"
       style="bottom:calc(1.5rem + var(--tg-safe-area-inset-bottom, 0px));">

    <nav class="pointer-events-auto rounded-[2rem] w-full max-w-md flex justify-around items-center p-1.5 nft-nav-bar">

      <button onclick="nftSwitchTab('shop')" id="nft-nav-shop"
              class="nft-nav-item active flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="text-[8px] font-semibold tracking-wide uppercase">Магазин</span>
      </button>

      <button onclick="nftSwitchTab('galleries')" id="nft-nav-galleries"
              class="nft-nav-item flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="text-[8px] font-semibold tracking-wide uppercase">Галереи</span>
      </button>

      <!-- Кнопка Назад -->
      <button onclick="closeNFTSection()"
              class="flex flex-col items-center justify-center w-14 h-14 rounded-2xl active:scale-95 transition-all nft-back-center-btn">
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#0d0601;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
        <span class="text-[8px] font-bold tracking-wide" style="color:#0d0601;">Назад</span>
      </button>

      <button onclick="nftSwitchTab('history')" id="nft-nav-history"
              class="nft-nav-item flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-[8px] font-semibold tracking-wide uppercase">История</span>
      </button>

      <button onclick="nftSwitchTab('gallery')" id="nft-nav-gallery"
              class="nft-nav-item flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-[8px] font-semibold tracking-wide uppercase">Моя</span>
      </button>

    </nav>
  </div>

</div>


<!-- ══ МОДАЛЬНОЕ ОКНО: ДЕТАЛИ КАРТИНЫ ════════════════════════════════════ -->
<div id="nft-painting-modal" class="fixed inset-0 backdrop-blur-sm hidden z-[80] overflow-y-auto"
     style="background: rgba(8,4,0,0.92);">
  <div class="min-h-full flex items-center justify-center p-4 py-8">
    <div class="rounded-3xl w-full max-w-sm overflow-hidden nft-modal-card">

      <!-- Изображение -->
      <div class="relative w-full" style="padding-top: 78%;">
        <img id="nft-modal-image" src="" alt=""
             class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0"
             style="background: linear-gradient(to bottom, transparent 50%, rgba(8,4,0,1) 100%);"></div>
        <!-- Декоративная рамка -->
        <div class="absolute inset-0 pointer-events-none nft-frame-overlay"></div>
        <!-- Бейдж лимита -->
        <div id="nft-modal-badge" class="absolute top-3 right-3 px-2.5 py-1 rounded-xl text-xs font-bold nft-badge"></div>
      </div>

      <!-- Информация -->
      <div class="px-5 pb-6 -mt-1">
        <div class="flex items-center gap-2 mb-3">
          <div class="nft-ornament-line-modal flex-1 h-px"></div>
          <span class="text-[10px] nft-ornament-diamond">◆</span>
          <div class="nft-ornament-line-modal flex-1 h-px"></div>
        </div>

        <h3 id="nft-modal-title" class="font-black text-xl mb-1.5 nft-modal-title-text"></h3>
        <p id="nft-modal-desc" class="text-sm mb-4 leading-relaxed nft-modal-desc-text"></p>

        <!-- Ценовой блок — всегда виден -->
        <div class="flex items-center justify-between mb-4 p-3 rounded-xl nft-price-block">
          <span class="text-sm nft-price-label">Стоимость</span>
          <div class="flex items-center gap-1.5">
            <img src="/gifts/stars.png" class="w-5 h-5 object-contain" onerror="this.style.display='none'">
            <span id="nft-modal-price" class="font-black text-lg nft-price-value"></span>
            <span class="text-xs nft-price-unit">звёзд</span>
          </div>
        </div>

        <!-- Кнопка покупки -->
        <button id="nft-modal-buy-btn" onclick="nftBuyFromModal()"
                class="w-full py-3.5 rounded-xl font-bold text-base mb-2 active:scale-[0.98] transition-transform nft-buy-btn">
          Купить
        </button>
        <button onclick="closeNFTModal('nft-painting-modal')"
                class="w-full py-3 rounded-xl font-semibold text-sm active:scale-95 transition-transform nft-close-btn">
          Закрыть
        </button>
      </div>
    </div>
  </div>
</div>

<style>
/* ══════════════════════════════════════════════
   NFT GALLERY v2 — Современный дизайн
══════════════════════════════════════════════ */
:root {
  --nft-gold:        #fbbf24;
  --nft-gold-light:  #fde68a;
  --nft-gold-dim:    rgba(251,191,36,0.22);
  --nft-gold-faint:  rgba(251,191,36,0.07);
  --nft-gold-glow:   rgba(251,191,36,0.35);
  --nft-amber:       #f59e0b;
  --nft-text:        #fdf4e3;
  --nft-text-muted:  rgba(253,244,227,0.45);
  --nft-border:      rgba(251,191,36,0.18);
  --nft-border-mid:  rgba(251,191,36,0.32);
  --nft-glass:       rgba(251,191,36,0.05);
  --nft-glass-card:  rgba(255,248,230,0.04);
}

/* ══ Острова: заголовок и баланс ══════════════ */
.nft-island-title {
  background: rgba(251,191,36,0.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(251,191,36,0.2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 0 1px rgba(251,191,36,0.04) inset;
}
.nft-icon-badge {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  box-shadow: 0 0 12px rgba(251,191,36,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
}
.nft-island-name  { color: var(--nft-text); }
.nft-island-sub   { color: var(--nft-text-muted); }

/* Остров баланса — точно как в основном проекте */
.nft-balance-island {
  background: rgba(251,191,36,0.07);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(251,191,36,0.18);
  box-shadow: 0 0 18px rgba(251,191,36,0.12);
}
.nft-balance-amount { color: #fbbf24; }
.nft-topup-btn {
  background: rgba(251,191,36,0.18);
  border-color: rgba(251,191,36,0.18);
  color: #fbbf24;
  transition: background 0.2s;
}
.nft-topup-btn:hover { background: rgba(251,191,36,0.28); }

/* ══ Острова: заголовки секций ════════════════ */
.nft-section-island {
  background: rgba(251,191,36,0.07);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(251,191,36,0.18);
  box-shadow: 0 2px 12px rgba(0,0,0,0.25), 0 0 20px rgba(251,191,36,0.05) inset;
}
.nft-island-heading { color: var(--nft-gold); }
.nft-island-ornament { color: rgba(251,191,36,0.5); }
.nft-section-hint { color: var(--nft-text-muted); }

/* ══ Пустые состояния ════════════════════════ */
.nft-empty-frame {
  background: var(--nft-glass);
  border: 1px solid var(--nft-border);
}
.nft-muted-text { color: var(--nft-text-muted); }

/* ══ Кнопки "назад" ══════════════════════════ */
.nft-back-btn {
  background: var(--nft-glass);
  border: 1px solid var(--nft-border);
  color: var(--nft-text-muted);
}

/* ══ CTA-кнопка ══════════════════════════════ */
.nft-cta-btn {
  background: linear-gradient(135deg, #b45309, #fbbf24);
  color: #0d0601;
  font-weight: 900;
  box-shadow: 0 4px 24px rgba(251,191,36,0.3);
}

/* ══ Навигационный бар ═══════════════════════ */
.nft-nav-bar {
  background: rgba(8, 4, 0, 0.88);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(251,191,36,0.15);
  box-shadow: 0 20px 50px rgba(0,0,0,0.85), 0 0 0 1px rgba(251,191,36,0.04) inset;
}
.nft-nav-item {
  color: rgba(251,191,36,0.3);
  transition: all 0.2s;
}
.nft-nav-item.active {
  color: var(--nft-gold);
  background: rgba(251,191,36,0.1);
  box-shadow: 0 0 16px rgba(251,191,36,0.15) inset;
}
.nft-nav-item.active svg,
.nft-nav-item.active span {
  filter: drop-shadow(0 0 6px rgba(251,191,36,0.6));
}
.nft-back-center-btn {
  background: linear-gradient(145deg, #fbbf24, #f59e0b);
  box-shadow: 0 0 28px rgba(251,191,36,0.5), 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
}

/* ══ Карточки магазина ════════════════════════ */
.nft-card {
  border-radius: 1.25rem;
  overflow: hidden;
  background: var(--nft-glass-card);
  border: 1px solid var(--nft-border);
  transition: transform 0.22s, box-shadow 0.22s;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  position: relative;
}
.nft-card:active { transform: scale(0.97); }
.nft-card.owned { border-color: var(--nft-border-mid); }
.nft-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity 0.25s;
  background: linear-gradient(135deg, rgba(251,191,36,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.nft-card:hover::after { opacity: 1; }

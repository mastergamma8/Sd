<style>
/* ══════════════════════════════════════════════
   NFT GALLERY v2 — Современный дизайн
══════════════════════════════════════════════ */
:root {
  --nft-gold:        #fbbf24;
  --nft-gold-light:  #fde68a;
  --nft-gold-dim:    rgba(251,191,36,0.22);
  --nft-gold-faint:  rgba(251,191,36,0.07);
  --nft-gold-glow:   rgba(251,191,36,0.35);
  --nft-amber:       #f59e0b;
  --nft-text:        #fdf4e3;
  --nft-text-muted:  rgba(253,244,227,0.45);
  --nft-border:      rgba(251,191,36,0.18);
  --nft-border-mid:  rgba(251,191,36,0.32);
  --nft-glass:       rgba(251,191,36,0.05);
  --nft-glass-card:  rgba(255,248,230,0.04);
}

/* ══ Острова: заголовок и баланс ══════════════ */
.nft-island-title {
  background: rgba(251,191,36,0.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(251,191,36,0.2);
  box-shadow: 0 0 15px rgba(251,191,36,0.08), 0 4px 16px rgba(0,0,0,0.3);
}
.nft-icon-badge {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  box-shadow: 0 0 12px rgba(251,191,36,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
}
.nft-island-name  { color: var(--nft-text); }
.nft-island-sub   { color: var(--nft-text-muted); }

/* Остров баланса */
.nft-balance-island {
  background: rgba(251,191,36,0.07);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(251,191,36,0.18);
  box-shadow: 0 0 18px rgba(251,191,36,0.12);
}
.nft-balance-amount { color: #fbbf24; }
.nft-topup-btn {
  background: rgba(251,191,36,0.18);
  border-color: rgba(251,191,36,0.18);
  color: #fbbf24;
  transition: background 0.2s;
}
.nft-topup-btn:hover { background: rgba(251,191,36,0.28); }

/* ══ Острова: заголовки секций ════════════════ */
.nft-section-island {
  background: rgba(251,191,36,0.07);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(251,191,36,0.18);
  box-shadow: 0 2px 12px rgba(0,0,0,0.25), 0 0 20px rgba(251,191,36,0.05) inset;
}
.nft-island-heading  { color: var(--nft-gold); }
.nft-island-ornament { color: rgba(251,191,36,0.5); }
.nft-section-hint    { color: var(--nft-text-muted); }

/* ══ Пустые состояния ════════════════════════ */
.nft-empty-frame {
  background: var(--nft-glass);
  border: 1px solid var(--nft-border);
}
.nft-muted-text { color: var(--nft-text-muted); }

/* ══ Кнопки «назад» ══════════════════════════ */
.nft-back-btn {
  background: var(--nft-glass);
  border: 1px solid var(--nft-border);
  color: var(--nft-text-muted);
}

/* ══ CTA-кнопка ══════════════════════════════ */
.nft-cta-btn {
  background: linear-gradient(135deg, #b45309, #fbbf24);
  color: #0d0601;
  font-weight: 900;
  box-shadow: 0 4px 24px rgba(251,191,36,0.3);
}

/* ══ Навигационный бар ═══════════════════════ */
.nft-nav-bar {
  background: rgba(8, 4, 0, 0.88);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(251,191,36,0.15);
  box-shadow: 0 20px 50px rgba(0,0,0,0.85), 0 0 0 1px rgba(251,191,36,0.04) inset;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 2px;
}
.nft-nav-bar::-webkit-scrollbar { display: none; }
.nft-nav-item {
  color: rgba(251,191,36,0.3);
  transition: all 0.2s;
}
.nft-nav-item.active {
  color: var(--nft-gold);
  background: rgba(251,191,36,0.1);
  box-shadow: 0 0 16px rgba(251,191,36,0.15) inset;
}
.nft-nav-item.active svg,
.nft-nav-item.active span {
  filter: drop-shadow(0 0 6px rgba(251,191,36,0.6));
}
.nft-back-center-btn {
  background: linear-gradient(145deg, rgba(251,191,36,0.55), rgba(245,158,11,0.5));
  box-shadow: 0 0 16px rgba(251,191,36,0.25), 0 4px 12px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
}

/* ══ Карточки магазина ════════════════════════ */
.nft-card {
  border-radius: 1.25rem;
  overflow: hidden;
  background: var(--nft-glass-card);
  border: 1px solid var(--nft-border);
  transition: transform 0.22s, box-shadow 0.22s;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  position: relative;
}
.nft-card:active { transform: scale(0.97); }
.nft-card.owned { border-color: var(--nft-border-mid); }
.nft-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity 0.25s;
  background: linear-gradient(135deg, rgba(251,191,36,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.nft-card:hover::after { opacity: 1; }

/* Карточки галереи (квадратные) */
.nft-gallery-card {
  border-radius: 1.1rem;
  overflow: hidden;
  background: var(--nft-glass-card);
  border: 1px solid var(--nft-border-mid);
  transition: transform 0.22s, box-shadow 0.22s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(251,191,36,0.05) inset;
  position: relative;
}
.nft-gallery-card:active { transform: scale(0.97); }

/* ══ Модальное окно ══════════════════════════ */
.nft-modal-card {
  background: rgba(10, 5, 0, 0.97);
  border: 1px solid var(--nft-border-mid);
  box-shadow: 0 0 80px rgba(251,191,36,0.12), 0 40px 80px rgba(0,0,0,0.95);
}
.nft-frame-overlay {
  border: 5px solid transparent;
  background:
    linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)) padding-box,
    linear-gradient(135deg, rgba(251,191,36,0.5) 0%, transparent 40%, transparent 60%, rgba(251,191,36,0.5) 100%) border-box;
  pointer-events: none;
}
.nft-ornament-line-modal { background: linear-gradient(90deg, transparent, rgba(251,191,36,0.45), transparent); }
.nft-ornament-diamond    { color: var(--nft-gold); font-size: 10px; opacity: 0.55; }
.nft-modal-title-text    { color: var(--nft-text); }
.nft-modal-desc-text     { color: var(--nft-text-muted); }
.nft-badge {
  background: rgba(251,191,36,0.88);
  color: #0d0601;
  font-weight: 900;
  backdrop-filter: blur(8px);
}

/* ══ Ценовой блок ════════════════════════════ */
.nft-price-block {
  background: rgba(251,191,36,0.07);
  border: 1px solid rgba(251,191,36,0.2);
}
.nft-price-label { color: var(--nft-text-muted); }
.nft-price-value { color: var(--nft-gold-light); }
.nft-price-unit  { color: var(--nft-text-muted); font-size: 0.7rem; }

/* ══ Кнопки модала ════════════════════════════ */
.nft-buy-btn {
  background: linear-gradient(135deg, #b45309 0%, #fbbf24 50%, #f59e0b 100%);
  color: #0d0601;
  font-weight: 900;
  box-shadow: 0 4px 30px rgba(251,191,36,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  letter-spacing: 0.04em;
}
.nft-close-btn {
  color: var(--nft-text-muted);
  background: rgba(251,191,36,0.05);
  border: 1px solid rgba(251,191,36,0.1);
  transition: all 0.2s;
}
.nft-close-btn:hover { color: var(--nft-gold); border-color: var(--nft-border); }

/* ══ Анимация появления ══════════════════════ */
#nft-section.nft-enter {
  animation: nftGalleryIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes nftGalleryIn {
  from { opacity: 0; transform: translateY(18px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Кнопки длительности аукциона */
.nft-duration-btn {
  background: rgba(251,191,36,0.06);
  border: 1px solid rgba(251,191,36,0.15);
  color: rgba(251,191,36,0.55);
  transition: all 0.15s;
}
.nft-duration-btn.active-duration {
  background: rgba(251,191,36,0.18);
  border-color: rgba(251,191,36,0.45);
  color: #fbbf24;
  box-shadow: 0 0 10px rgba(251,191,36,0.15) inset;
}

/* Статусные бейджи на карточках галереи */
.nft-status-badge {
  position: absolute;
  top: 6px; right: 6px;
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.04em;
  backdrop-filter: blur(8px);
  z-index: 2;
}
.nft-status-for-sale   { background: rgba(251,191,36,0.85); color: #0d0601; }
.nft-status-in-auction { background: rgba(239,68,68,0.82);  color: #fff; }

/* В модальном окне бейдж статуса — строчный, не абсолютный */
#nft-modal-status-badge .nft-status-badge {
  position: static;
  display: inline-block;
  font-size: 10px;
  padding: 3px 10px;
}

/* Кнопки продажи/аукциона на карточках */
.nft-card-actions {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  gap: 4px;
  padding: 4px;
  background: linear-gradient(to top, rgba(8,4,0,0.92) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 3;
}
.nft-gallery-card:hover .nft-card-actions,
.nft-gallery-card:active .nft-card-actions { opacity: 1; }
</style>

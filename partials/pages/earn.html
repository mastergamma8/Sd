<!-- СТРАНИЦА 4: ЗАРАБОТОК -->
<div id="page-earn" class="px-5 pb-5 hidden-tab fade-in">
    <h2 class="text-2xl font-bold mb-4 text-white text-center" data-i18n="earn_title">Заработок</h2>
    <div class="flex bg-black/30 rounded-2xl p-1 border border-white/5 mb-6">
        <button onclick="switchEarnSubtab('referrals')" id="subtab-referrals" class="earn-tab-btn active flex-1 py-2 rounded-xl text-sm font-bold" data-i18n="tab_refs">Рефералы</button>
        <button onclick="switchEarnSubtab('tasks')"     id="subtab-tasks"     class="earn-tab-btn flex-1 py-2 rounded-xl text-sm font-bold" data-i18n="tab_tasks">Задания</button>
    </div>
    <div id="earn-referrals">
        <!-- Блок информации о реферальной программе -->
        <div class="glass rounded-3xl p-6 text-center mb-4">
            <div class="w-24 h-24 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-blue-400/30 glow-box">
                <img src="/gifts/donuts.png" class="w-16 h-16 object-contain"/>
            </div>
            <h3 class="text-lg font-bold text-white mb-2" data-i18n="invite_friends">Приглашайте друзей</h3>
            <p class="text-sm text-blue-200/70 mb-4 leading-relaxed" id="ref-desc"></p>
            <div class="flex gap-2 mb-4">
                <div class="flex-1 bg-blue-500/10 border border-blue-400/20 rounded-2xl p-3 flex flex-col items-center gap-1">
                    <img src="/gifts/ton.png" class="w-6 h-6 object-contain"/>
                    <span class="text-xs font-bold text-blue-300" data-i18n="ref_bonus_ton_label">10% TON</span>
                    <span class="text-xs text-blue-200/50" data-i18n="ref_bonus_ton_sub">с подарка друга</span>
                </div>
                <div class="flex-1 bg-yellow-500/10 border border-yellow-400/20 rounded-2xl p-3 flex flex-col items-center gap-1">
                    <img src="/gifts/stars.png" class="w-6 h-6 object-contain"/>
                    <span class="text-xs font-bold text-yellow-300" data-i18n="ref_bonus_stars_label">10% звёзд</span>
                    <span class="text-xs text-yellow-200/50" data-i18n="ref_bonus_stars_sub">с пополнения друга</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="shareRefLink()" class="flex-1 btn-primary py-3.5 rounded-xl font-bold text-white active:scale-95 transition-transform" data-i18n="btn_invite">Пригласить друзей</button>
                <button onclick="copyRefLink()"  class="w-14 glass flex items-center justify-center rounded-xl active:scale-95 transition-transform border border-white/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Блок накопленных реферальных заработков -->
        <div class="glass rounded-3xl p-5 mb-6 border border-white/10">
            <h4 class="text-sm font-bold text-white/70 uppercase tracking-wider mb-4" data-i18n="ref_earnings_title">Заработано рефералами</h4>

            <!-- TON заработок -->
            <div class="flex items-center justify-between mb-3 bg-blue-500/10 rounded-2xl p-3 border border-blue-400/20">
                <div class="flex items-center gap-3">
                    <img src="/gifts/ton.png" class="w-9 h-9 object-contain"/>
                    <div>
                        <div class="text-xs text-blue-200/60 font-medium" data-i18n="ref_earned_ton">TON заработано</div>
                        <div class="text-lg font-bold text-white" id="ref-ton-earned">0</div>
                        <div class="text-xs text-blue-300/50" data-i18n="ref_min_ton">Минимум для получения: 1 TON</div>
                    </div>
                </div>
            </div>

            <!-- Звёзды заработок -->
            <div class="flex items-center justify-between mb-4 bg-yellow-500/10 rounded-2xl p-3 border border-yellow-400/20">
                <div class="flex items-center gap-3">
                    <img src="/gifts/stars.png" class="w-9 h-9 object-contain"/>
                    <div>
                        <div class="text-xs text-yellow-200/60 font-medium" data-i18n="ref_earned_stars">Звёзды заработано</div>
                        <div class="text-lg font-bold text-white" id="ref-stars-earned">0</div>
                        <div class="text-xs text-yellow-300/50" data-i18n="ref_min_stars">Минимум для получения: 100 ⭐</div>
                    </div>
                </div>
            </div>

            <!-- Кнопки клейма -->
            <div class="flex gap-2">
                <button
                    id="btn-claim-ton"
                    onclick="claimReferralTon()"
                    class="flex-1 btn-primary py-3.5 rounded-xl font-bold text-white active:scale-95 transition-transform disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2"
                    disabled
                ><img src="/gifts/ton.png" class="w-4 h-4 object-contain"><span data-i18n="btn_claim_ton">Забрать TON</span></button>
                <button
                    id="btn-claim-stars"
                    onclick="claimReferralStars()"
                    class="flex-1 py-3.5 rounded-xl font-bold text-yellow-300 active:scale-95 transition-transform disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2 bg-yellow-500/20 border border-yellow-400/30"
                    disabled
                ><img src="/gifts/stars.png" class="w-4 h-4 object-contain"><span data-i18n="btn_claim_stars">Забрать ⭐</span></button>
            </div>
        </div>

        <h4 class="text-md font-bold text-white mb-3" data-i18n="your_refs">Ваши приглашенные</h4>
        <div id="referrals-list" class="flex flex-col gap-3"></div>
    </div>
    <div id="earn-tasks" class="hidden-tab">
        <p class="text-sm text-blue-200/60 mb-4 text-center" id="tasks-desc"></p>
        <div id="tasks-list" class="flex flex-col gap-3"></div>
    </div>
</div>

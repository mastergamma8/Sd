<!-- ═══════════════════════════════════════════════════════════
     NFT ГАЛЕРЕЯ — Модальные окна (v2)
     Все диалоги: картина, покупка, продажа, аукцион, ставка
═══════════════════════════════════════════════════════════ -->


<!-- ══ МОДАЛЬНОЕ ОКНО: ДЕТАЛИ КАРТИНЫ ════════════════════════════════════ -->
<div id="nft-painting-modal" class="fixed inset-0 backdrop-blur-sm hidden z-[80] overflow-y-auto"
     style="background: rgba(8,4,0,0.92);">
  <div class="min-h-full flex items-center justify-center p-4 py-8">
    <div class="rounded-3xl w-full max-w-sm overflow-hidden nft-modal-card">

      <!-- Изображение -->
      <div class="relative w-full" style="padding-top: 78%;">
        <img id="nft-modal-image" src="" alt=""
             class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0"
             style="background: linear-gradient(to bottom, transparent 50%, rgba(8,4,0,1) 100%);"></div>
        <!-- Декоративная рамка -->
        <div class="absolute inset-0 pointer-events-none nft-frame-overlay"></div>
        <!-- Бейдж лимита -->
        <div id="nft-modal-badge" class="absolute top-3 right-3 px-2.5 py-1 rounded-xl text-xs font-bold nft-badge"></div>
      </div>

      <!-- Информация -->
      <div class="px-5 pb-6 -mt-1">
        <div class="flex items-center gap-2 mb-3">
          <div class="nft-ornament-line-modal flex-1 h-px"></div>
          <span class="text-[10px] nft-ornament-diamond">◆</span>
          <div class="nft-ornament-line-modal flex-1 h-px"></div>
        </div>

        <!-- Статусный бейдж (для картин на продаже/аукционе) -->
        <div id="nft-modal-status-badge" class="hidden mb-3"></div>

        <h3 id="nft-modal-title" class="font-black text-xl mb-1.5 nft-modal-title-text"></h3>

        <!-- Серийный номер -->
        <div id="nft-modal-serial-row" class="hidden items-center gap-2 mb-2">
          <span class="text-[10px] tracking-widest uppercase" style="color:rgba(251,191,36,0.45);">Серийный №</span>
          <span id="nft-modal-serial-num" class="font-black text-sm" style="color:#fbbf24;"></span>
        </div>

        <!-- Тираж -->
        <div id="nft-modal-supply-row" class="hidden items-center gap-2 mb-2">
          <span class="text-[10px] tracking-widest uppercase" style="color:rgba(251,191,36,0.45);">Тираж</span>
          <span id="nft-modal-supply-text" class="font-black text-sm" style="color:#fbbf24;"></span>
        </div>

        <!-- Продавец (для маркета / аукциона) -->
        <div id="nft-modal-seller-row" class="hidden items-center gap-2 mb-3 p-2.5 rounded-xl"
             style="background:rgba(251,191,36,0.04);border:1px solid rgba(251,191,36,0.1);">
          <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:rgba(251,191,36,0.45);">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="text-[10px]" style="color:rgba(251,191,36,0.5);">Продавец:</span>
          <span id="nft-modal-seller-name" class="text-xs font-semibold" style="color:rgba(253,244,227,0.8);"></span>
        </div>

        <p id="nft-modal-desc" class="text-sm mb-4 leading-relaxed nft-modal-desc-text"></p>

        <!-- Ценовой блок -->
        <div class="flex items-center justify-between mb-4 p-3 rounded-xl nft-price-block">
          <span class="text-sm nft-price-label">Стоимость</span>
          <div class="flex items-center gap-1.5">
            <img src="/gifts/stars.png" class="w-5 h-5 object-contain" onerror="this.style.display='none'">
            <span id="nft-modal-price" class="font-black text-lg nft-price-value"></span>
            <span class="text-xs nft-price-unit">звёзд</span>
          </div>
        </div>

        <!-- Кнопки владельца (заполняются динамически через JS) -->
        <div id="nft-modal-owner-actions" class="hidden gap-2 mb-2"></div>

        <!-- Кнопка покупки (магазин / маркет) или ставки (аукцион) -->
        <button id="nft-modal-buy-btn" onclick="nftBuyFromModal()"
                class="w-full py-3.5 rounded-xl font-bold text-base mb-2 active:scale-[0.98] transition-transform nft-buy-btn">
          Купить
        </button>
        <button onclick="closeNFTModal('nft-painting-modal')"
                class="w-full py-3 rounded-xl font-semibold text-sm active:scale-95 transition-transform nft-close-btn flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Назад
        </button>
      </div>
    </div>
  </div>
</div>


<!-- ══ МОДАЛЬНОЕ ОКНО: ПОДТВЕРЖДЕНИЕ ПОКУПКИ С МАРКЕТПЛЕЙСА ══════════════ -->
<div id="nft-buy-confirm-modal" class="fixed inset-0 backdrop-blur-sm hidden z-[80]"
     style="background:rgba(8,4,0,0.92);">
  <div class="min-h-full flex items-center justify-center p-4">
    <div class="rounded-3xl w-full max-w-sm overflow-hidden nft-modal-card p-6">
      <div class="text-center mb-5">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl flex items-center justify-center"
             style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
        </div>
        <h3 class="font-black text-lg mb-1" style="color:#fdf4e3;">Купить картину</h3>
        <p id="nft-buy-confirm-title" class="text-sm mb-4" style="color:rgba(253,244,227,0.6);"></p>
      </div>
      <div class="flex items-center justify-between p-3 rounded-xl mb-2 nft-price-block">
        <span class="text-sm nft-price-label">Цена</span>
        <div class="flex items-center gap-1.5">
          <img src="/gifts/stars.png" class="w-5 h-5 object-contain" onerror="this.style.display='none'">
          <span id="nft-buy-confirm-price" class="font-black text-lg nft-price-value"></span>
          <span class="text-xs nft-price-unit">звёзд</span>
        </div>
      </div>
      <div class="flex items-center justify-between p-3 rounded-xl mb-5"
           style="background:rgba(251,191,36,0.04);border:1px solid rgba(251,191,36,0.1);">
        <span class="text-xs" style="color:rgba(253,244,227,0.4);">Ваш баланс</span>
        <div class="flex items-center gap-1">
          <img src="/gifts/stars.png" class="w-4 h-4 object-contain" onerror="this.style.display='none'">
          <span id="nft-buy-confirm-stars" class="font-bold text-sm" style="color:rgba(251,191,36,0.7);"></span>
        </div>
      </div>
      <button id="nft-buy-confirm-btn" onclick="nftExecuteBuyListing()"
              class="w-full py-3.5 rounded-xl font-bold text-base mb-2 active:scale-[0.98] transition-transform nft-buy-btn">
        Подтвердить покупку
      </button>
      <button onclick="closeNFTModal('nft-buy-confirm-modal')"
              class="w-full py-3 rounded-xl font-semibold text-sm active:scale-95 transition-transform nft-close-btn">
        Отмена
      </button>
    </div>
  </div>
</div>


<!-- ══ МОДАЛЬНОЕ ОКНО: ВЫСТАВИТЬ НА ПРОДАЖУ ══════════════════════════════ -->
<div id="nft-list-modal" class="fixed inset-0 backdrop-blur-sm hidden z-[80]"
     style="background:rgba(8,4,0,0.92);">
  <div class="min-h-full flex items-center justify-center p-4">
    <div class="rounded-3xl w-full max-w-sm overflow-hidden nft-modal-card p-6">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-14 h-14 rounded-xl overflow-hidden flex-shrink-0"
             style="border:1px solid rgba(251,191,36,0.2);">
          <img id="nft-list-modal-img" src="" class="w-full h-full object-cover">
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-wider mb-0.5" style="color:rgba(251,191,36,0.5);">Продажа картины</p>
          <p id="nft-list-modal-title" class="font-bold text-sm" style="color:#fdf4e3;"></p>
        </div>
      </div>
      <label class="block mb-1.5 text-xs font-semibold" style="color:rgba(251,191,36,0.7);">
        Цена продажи (NFT-звёзды)
      </label>
      <div class="flex items-center gap-2 p-3 rounded-xl mb-5"
           style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);">
        <img src="/gifts/stars.png" class="w-5 h-5 object-contain flex-shrink-0" onerror="this.style.display='none'">
        <input id="nft-list-price-input" type="number" min="1" max="1000000" placeholder="Например, 100"
               class="flex-1 bg-transparent outline-none text-base font-bold"
               style="color:#fbbf24;caret-color:#fbbf24;"
               oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      </div>
      <button id="nft-list-submit-btn" onclick="nftSubmitListing()"
              class="w-full py-3.5 rounded-xl font-bold text-base mb-2 active:scale-[0.98] transition-transform nft-buy-btn">
        Выставить на продажу
      </button>
      <button onclick="closeNFTModal('nft-list-modal')"
              class="w-full py-3 rounded-xl font-semibold text-sm active:scale-95 transition-transform nft-close-btn">
        Отмена
      </button>
    </div>
  </div>
</div>


<!-- ══ МОДАЛЬНОЕ ОКНО: СОЗДАТЬ АУКЦИОН ══════════════════════════════════ -->
<div id="nft-auction-create-modal" class="fixed inset-0 backdrop-blur-sm hidden z-[80]"
     style="background:rgba(8,4,0,0.92);">
  <div class="min-h-full flex items-center justify-center p-4">
    <div class="rounded-3xl w-full max-w-sm overflow-hidden nft-modal-card p-6">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-14 h-14 rounded-xl overflow-hidden flex-shrink-0"
             style="border:1px solid rgba(251,191,36,0.2);">
          <img id="nft-auction-modal-img" src="" class="w-full h-full object-cover">
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-wider mb-0.5" style="color:rgba(251,191,36,0.5);">Запустить аукцион</p>
          <p id="nft-auction-modal-title" class="font-bold text-sm" style="color:#fdf4e3;"></p>
        </div>
      </div>
      <label class="block mb-1.5 text-xs font-semibold" style="color:rgba(251,191,36,0.7);">
        Начальная цена (NFT-звёзды)
      </label>
      <div class="flex items-center gap-2 p-3 rounded-xl mb-4"
           style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);">
        <img src="/gifts/stars.png" class="w-5 h-5 object-contain flex-shrink-0" onerror="this.style.display='none'">
        <input id="nft-auction-start-price" type="number" min="1" max="1000000" placeholder="Например, 50"
               class="flex-1 bg-transparent outline-none text-base font-bold"
               style="color:#fbbf24;caret-color:#fbbf24;"
               oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      </div>
      <label class="block mb-2 text-xs font-semibold" style="color:rgba(251,191,36,0.7);">
        Длительность
      </label>
      <div class="grid grid-cols-3 gap-2 mb-5">
        <button class="nft-duration-btn py-2 rounded-xl text-xs font-bold active:scale-95 transition-all" data-hours="1"
                onclick="nftSelectDuration(this, 1)">1 час</button>
        <button class="nft-duration-btn py-2 rounded-xl text-xs font-bold active:scale-95 transition-all" data-hours="3"
                onclick="nftSelectDuration(this, 3)">3 часа</button>
        <button class="nft-duration-btn py-2 rounded-xl text-xs font-bold active:scale-95 transition-all" data-hours="6"
                onclick="nftSelectDuration(this, 6)">6 часов</button>
        <button class="nft-duration-btn py-2 rounded-xl text-xs font-bold active:scale-95 transition-all" data-hours="12"
                onclick="nftSelectDuration(this, 12)">12 часов</button>
        <button class="nft-duration-btn active-duration py-2 rounded-xl text-xs font-bold active:scale-95 transition-all" data-hours="24"
                onclick="nftSelectDuration(this, 24)">24 часа</button>
        <button class="nft-duration-btn py-2 rounded-xl text-xs font-bold active:scale-95 transition-all" data-hours="48"
                onclick="nftSelectDuration(this, 48)">48 часов</button>
      </div>
      <button id="nft-auction-submit-btn" onclick="nftSubmitAuction()"
              class="w-full py-3.5 rounded-xl font-bold text-base mb-2 active:scale-[0.98] transition-transform nft-buy-btn">
        🔨 Запустить аукцион
      </button>
      <button onclick="closeNFTModal('nft-auction-create-modal')"
              class="w-full py-3 rounded-xl font-semibold text-sm active:scale-95 transition-transform nft-close-btn">
        Отмена
      </button>
    </div>
  </div>
</div>


<!-- ══ МОДАЛЬНОЕ ОКНО: СДЕЛАТЬ СТАВКУ ════════════════════════════════════ -->
<div id="nft-bid-modal" class="fixed inset-0 backdrop-blur-sm hidden z-[80]"
     style="background:rgba(8,4,0,0.92);">
  <div class="min-h-full flex items-center justify-center p-4">
    <div class="rounded-3xl w-full max-w-sm overflow-hidden nft-modal-card p-6">
      <div class="text-center mb-5">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl flex items-center justify-center"
             style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 10l4.553-2.069A1 1 0 0121 8.87V15.13a1 1 0 01-1.447.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </div>
        <h3 class="font-black text-lg mb-1" style="color:#fdf4e3;">Сделать ставку</h3>
        <p id="nft-bid-modal-title" class="text-sm" style="color:rgba(253,244,227,0.6);"></p>
      </div>
      <div class="flex items-center justify-between p-3 rounded-xl mb-2 nft-price-block">
        <span class="text-sm nft-price-label">Текущая ставка</span>
        <div class="flex items-center gap-1.5">
          <img src="/gifts/stars.png" class="w-4 h-4 object-contain" onerror="this.style.display='none'">
          <span id="nft-bid-current-price" class="font-black text-base nft-price-value"></span>
          <span class="text-xs nft-price-unit">⭐</span>
        </div>
      </div>
      <div class="flex items-center justify-between p-3 rounded-xl mb-4"
           style="background:rgba(251,191,36,0.04);border:1px solid rgba(251,191,36,0.1);">
        <span class="text-xs" style="color:rgba(253,244,227,0.4);">Ваш баланс</span>
        <div class="flex items-center gap-1">
          <img src="/gifts/stars.png" class="w-4 h-4 object-contain" onerror="this.style.display='none'">
          <span id="nft-bid-your-balance" class="font-bold text-sm" style="color:rgba(251,191,36,0.7);"></span>
        </div>
      </div>
      <label class="block mb-1.5 text-xs font-semibold" style="color:rgba(251,191,36,0.7);">
        Ваша ставка (должна быть выше текущей)
      </label>
      <div class="flex items-center gap-2 p-3 rounded-xl mb-5"
           style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);">
        <img src="/gifts/stars.png" class="w-5 h-5 object-contain flex-shrink-0" onerror="this.style.display='none'">
        <input id="nft-bid-amount-input" type="number" min="1" max="1000000"
               class="flex-1 bg-transparent outline-none text-base font-bold"
               style="color:#fbbf24;caret-color:#fbbf24;"
               oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      </div>
      <button id="nft-bid-submit-btn" onclick="nftSubmitBid()"
              class="w-full py-3.5 rounded-xl font-bold text-base mb-2 active:scale-[0.98] transition-transform nft-buy-btn">
        🔨 Поставить
      </button>
      <button onclick="closeNFTModal('nft-bid-modal')"
              class="w-full py-3 rounded-xl font-semibold text-sm active:scale-95 transition-transform nft-close-btn">
        Отмена
      </button>
    </div>
  </div>
</div>

<!-- ХЭДЕР -->
<header class="px-3 flex justify-between items-center relative z-[45] sticky top-0 mb-4 transition-all duration-300 bg-transparent" style="padding-top: calc(1rem + var(--tg-safe-area-inset-top, 0px));">
    
    <!-- Логотип (в ультралегком стеклянном кружке) -->
    <div class="flex items-center justify-center rounded-full w-10 h-10 shadow-[0_8px_20px_rgba(0,0,0,0.3)] border border-white/10 flex-shrink-0 active:scale-95 transition-all bg-slate-900/25 backdrop-blur-xl">
         <img src="/gifts/sd.png" class="w-6 h-6 object-contain drop-shadow-[0_2px_8px_rgba(255,255,255,0.15)]" onerror="this.src='https://via.placeholder.com/24?text=🍩'">
    </div>
    
    <!-- Контейнер балансов с оптимизированными отступами под любые экраны -->
    <div class="flex items-center gap-1.5 sm:gap-2 max-w-[calc(100%-3rem)]">
        
        <!-- Баланс пончиков -->
        <div class="flex items-center rounded-full text-xs sm:text-sm font-bold text-blue-300 shadow-[0_4px_15px_rgba(59,130,246,0.12)] border border-white/10 bg-slate-900/25 backdrop-blur-xl pl-2.5 pr-1 py-1 h-9">
            <div class="flex items-center gap-1 mr-1.5">
                <img src="/gifts/dount.png" class="w-3.5 h-3.5 object-contain drop-shadow" onerror="this.src='https://via.placeholder.com/14?text=🍩'">
                <span id="balance-amount" class="tracking-tight text-[11px] sm:text-xs">0</span>
            </div>
            <!-- Кнопка "Как получить пончики" -->
            <button onclick="openModal('add-gift-modal')" class="w-7 h-7 bg-blue-500/15 hover:bg-blue-500/30 text-blue-300 rounded-full border border-white/5 active:scale-90 transition-all flex items-center justify-center">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
            </button>
        </div>

        <!-- Баланс TON -->
        <div class="flex items-center rounded-full text-xs sm:text-sm font-bold shadow-[0_4px_15px_rgba(0,152,234,0.12)] border border-white/10 bg-slate-900/25 backdrop-blur-xl pl-2.5 pr-1 py-1 h-9" style="color:#0098EA;">
            <div class="flex items-center gap-1 mr-1.5">
                <img src="/gifts/ton.png" class="w-3.5 h-3.5 object-contain drop-shadow ton-icon-img"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <svg class="w-3.5 h-3.5 ton-icon-svg hidden" viewBox="0 0 56 56" fill="#0098EA">
                    <path d="M28 0C12.536 0 0 12.536 0 28s12.536 28 28 28 28-12.536 28-28S43.464 0 28 0zm13.156 17H14.844l13.312 22.781L41.156 17z"/>
                </svg>
                <span id="ton-balance-amount" class="tracking-tight text-[11px] sm:text-xs" style="color:#0098EA;">0</span>
            </div>
            <!-- Кнопка управления TON-кошельком -->
            <button onclick="openTonWalletModal()" class="w-7 h-7 rounded-full border border-white/5 active:scale-90 transition-all flex items-center justify-center text-[#0098EA] bg-[#0098ea]/15 hover:bg-[#0098ea]/35">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
            </button>
        </div>
        
        <!-- Баланс звезд -->
        <div class="flex items-center rounded-full text-xs sm:text-sm font-bold text-yellow-400 shadow-[0_4px_15px_rgba(250,204,21,0.12)] border border-white/10 bg-slate-900/25 backdrop-blur-xl pl-2.5 pr-1 py-1 h-9">
            <div class="flex items-center gap-1 mr-1.5">
                <img src="/gifts/stars.png" class="w-3.5 h-3.5 object-contain drop-shadow" onerror="this.src='https://via.placeholder.com/14?text=⭐'">
                <span id="stars-amount" class="tracking-tight text-[11px] sm:text-xs">0</span>
            </div>
            <!-- Кнопка пополнения звезд -->
            <button onclick="openTopupModal()" class="w-7 h-7 bg-yellow-500/15 hover:bg-yellow-500/30 text-yellow-400 rounded-full border border-white/5 active:scale-90 transition-all flex items-center justify-center">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
            </button>
        </div>

    </div>
</header>
